name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Provision MariaDB (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mariadb-server
      - name: Provision MariaDB (macOS)
        if: runner.os == 'macOS'
        run: brew install mariadb
      - name: Provision MariaDB (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          choco install mariadb -y --no-progress
          "/c/Program Files/MariaDB"*/bin/mysql.exe -u root \
            -e "CREATE DATABASE IF NOT EXISTS mispfleet_test"
          echo "MISPFLEET_TEST_MARIADB_DSN=mysql://root@127.0.0.1:3306/mispfleet_test" \
            >> "$GITHUB_ENV"
      - name: Install (locked dependencies)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps
      - name: Format
        run: black --check .
      - name: Lint
        run: ruff check .
      - name: Types
        run: mypy .
      - name: Tests (100% coverage enforced)
        run: pytest
      - name: Security scan
        run: bandit -r -q .
      - name: Dependency audit
        run: pip-audit
      - name: Build
        run: python -m build
      - name: Check distribution
        run: twine check dist/*
      - name: CLI smoke test
        run: |
          mispfleet version
          mispfleet --help
          mispfleet completion bash > /dev/null
      - name: Wheel and sdist installation test
        shell: bash
        run: |
          for artifact in dist/*.whl dist/*.tar.gz; do
            rm -rf /tmp/install-env
            python -m venv /tmp/install-env
            VENV_BIN="/tmp/install-env/bin"
            [ -d "$VENV_BIN" ] || VENV_BIN="/tmp/install-env/Scripts"
            "$VENV_BIN/python" -m pip install --quiet "$artifact"
            "$VENV_BIN/mispfleet" version
          done
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Build documentation
        run: |
          python -m pip install mkdocs-material
          mkdocs build --strict
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Secret scanning
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
