name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Provision MariaDB (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mariadb-server
      - name: Provision MariaDB (macOS)
        if: runner.os == 'macOS'
        run: brew install mariadb
      - name: Provision MariaDB (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          choco install mariadb -y --no-progress
          "/c/Program Files/MariaDB"*/bin/mysql.exe -u root \
            -e "CREATE DATABASE IF NOT EXISTS mispfleet_test"
          echo "MISPFLEET_TEST_MARIADB_DSN=mysql://root@127.0.0.1:3306/mispfleet_test" \
            >> "$GITHUB_ENV"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Format
        run: black --check .
      - name: Lint
        run: ruff check .
      - name: Types
        run: mypy .
      - name: Tests (100% coverage enforced)
        run: pytest
      - name: Security scan
        run: bandit -r -q .
      - name: Dependency audit
        run: pip-audit
      - name: Build
        run: python -m build
      - name: Check distribution
        run: twine check dist/*
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Build documentation
        run: |
          python -m pip install mkdocs-material
          mkdocs build --strict
